name: Build iOS IPA (Full Unlocked)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/ios/**'
      - '.github/workflows/build-ios-ipa.yml'

jobs:
  build-ipa:
    name: Build Orange Cloud IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Show Available Destinations
        run: |
          cd "apps/ios/Orange Cloud"
          xcodebuild -project "Orange Cloud.xcodeproj" -scheme "Orange Cloud" -showdestinations || true

      - name: Build & Archive iOS App
        run: |
          cd "apps/ios/Orange Cloud"
          set -o pipefail
          xcodebuild archive \
            -project "Orange Cloud.xcodeproj" \
            -scheme "Orange Cloud" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/OrangeCloud.xcarchive \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcodebuild.log || {
              echo "==================== BUILD FAILED: LAST 100 LINES ===================="
              tail -n 100 xcodebuild.log
              exit 1
            }

      - name: Package into IPA
        run: |
          cd "apps/ios/Orange Cloud"
          mkdir -p Payload
          APP_PATH="./build/OrangeCloud.xcarchive/Products/Applications/Orange Cloud.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find ./build -name "*.app" -type d | head -n 1)
          fi
          echo "Using App: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r -9 OrangeCloud-Full-Unlocked.ipa Payload
          echo "IPA packaged successfully:"
          ls -lh OrangeCloud-Full-Unlocked.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeCloud-Full-Unlocked-IPA
          path: apps/ios/Orange Cloud/OrangeCloud-Full-Unlocked.ipa
          if-no-files-found: error
