name: Build iOS IPA (Full Unlocked)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/ios/**'
      - '.github/workflows/build-ios-ipa.yml'

jobs:
  build-ipa:
    name: Build Orange Cloud IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Build iOS App (.app)
        run: |
          cd "apps/ios/Orange Cloud"
          xcodebuild build \
            -project "Orange Cloud.xcodeproj" \
            -scheme "Orange Cloud" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./derived_build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package into IPA
        run: |
          cd "apps/ios/Orange Cloud"
          APP_PATH=$(find derived_build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -9 OrangeCloud-Full-Unlocked.ipa Payload
          echo "IPA packaged successfully:"
          ls -lh OrangeCloud-Full-Unlocked.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeCloud-Full-Unlocked-IPA
          path: apps/ios/Orange Cloud/OrangeCloud-Full-Unlocked.ipa
          if-no-files-found: error
