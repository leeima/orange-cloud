name: Build iOS IPA (Full Unlocked)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/ios/**'
      - '.github/workflows/build-ios-ipa.yml'

jobs:
  build-ipa:
    name: Build Orange Cloud IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Working Xcode with iOS Platform
        run: |
          cd "apps/ios/Orange Cloud"
          echo "=== All Available Xcode Versions ==="
          ls -ld /Applications/Xcode*
          
          FOUND_XCODE=""
          # Check each installed Xcode to find which one has the iOS platform installed
          for app in /Applications/Xcode.app $(ls -d /Applications/Xcode_*.app 2>/dev/null); do
            echo "Testing $app ..."
            sudo xcode-select -s "$app"
            if xcodebuild -project "Orange Cloud.xcodeproj" -scheme "Orange Cloud" -showdestinations 2>&1 | grep -A 10 "Eligible destinations" | grep -q "platform:iOS"; then
              echo ">>> Selected $app (has eligible iOS destination)"
              FOUND_XCODE="$app"
              break
            fi
          done
          
          if [ -z "$FOUND_XCODE" ]; then
            echo "No Xcode has eligible iOS platform pre-installed, trying to download iOS platform..."
            xcodebuild -downloadPlatform iOS || true
          fi
          
          xcodebuild -version
          xcodebuild -showsdks

      - name: Show Available Destinations
        run: |
          cd "apps/ios/Orange Cloud"
          xcodebuild -project "Orange Cloud.xcodeproj" -scheme "Orange Cloud" -showdestinations || true

      - name: Build & Archive iOS App
        run: |
          cd "apps/ios/Orange Cloud"
          set -o pipefail
          xcodebuild archive \
            -project "Orange Cloud.xcodeproj" \
            -scheme "Orange Cloud" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/OrangeCloud.xcarchive \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcodebuild.log || {
              echo "==================== BUILD FAILED: ERROR SUMMARY ===================="
              grep -i -C 2 "error:" xcodebuild.log | head -n 100 || true
              echo "==================== BUILD FAILED: LAST 60 LINES ===================="
              tail -n 60 xcodebuild.log
              exit 1
            }

      - name: Package into IPA
        if: success()
        run: |
          cd "apps/ios/Orange Cloud"
          mkdir -p Payload
          APP_PATH="./build/OrangeCloud.xcarchive/Products/Applications/Orange Cloud.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find ./build -name "*.app" -type d | head -n 1)
          fi
          echo "Using App: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r -9 OrangeCloud-Full-Unlocked.ipa Payload
          echo "IPA packaged successfully:"
          ls -lh OrangeCloud-Full-Unlocked.ipa

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeCloud-Full-Unlocked-IPA
          path: apps/ios/Orange Cloud/OrangeCloud-Full-Unlocked.ipa
          if-no-files-found: error

      - name: Upload Build Log on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-failure-log
          path: apps/ios/Orange Cloud/xcodebuild.log
