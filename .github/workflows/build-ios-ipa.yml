name: Build iOS IPA (Full Unlocked)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/ios/**'
      - '.github/workflows/build-ios-ipa.yml'

jobs:
  build-ipa:
    name: Build Orange Cloud IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Working Xcode with iOS Platform
        run: |
          cd "apps/ios/Orange Cloud"
          echo "=== All Available Xcode Versions ==="
          ls -ld /Applications/Xcode*
          
          FOUND_XCODE=""
          # Check each installed Xcode to find which one has the iOS platform installed
          for app in /Applications/Xcode.app $(ls -d /Applications/Xcode_*.app 2>/dev/null); do
            echo "Testing $app ..."
            sudo xcode-select -s "$app"
            if xcodebuild -project "Orange Cloud.xcodeproj" -scheme "Orange Cloud" -showdestinations 2>&1 | grep -A 10 "Eligible destinations" | grep -q "platform:iOS"; then
              echo ">>> Selected $app (has eligible iOS destination)"
              FOUND_XCODE="$app"
              break
            fi
          done
          
          if [ -z "$FOUND_XCODE" ]; then
            echo "No Xcode has eligible iOS platform pre-installed, trying to download iOS platform..."
            xcodebuild -downloadPlatform iOS || true
          fi
          
          xcodebuild -version
          xcodebuild -showsdks

      - name: Show Available Destinations
        run: |
          cd "apps/ios/Orange Cloud"
          xcodebuild -project "Orange Cloud.xcodeproj" -scheme "Orange Cloud" -showdestinations || true

      - name: Build & Archive iOS App (Release -> Debug fallback)
        run: |
          cd "apps/ios/Orange Cloud"
          echo "=== 全部可用 Xcode ==="
          ls -d /Applications/Xcode*.app || true
          echo "当前选中: $(xcode-select -p)"
          xcodebuild -version

          set +e
          OK_CFG=""
          for CFG in Release Debug; do
            echo ""
            echo "════════════════ 尝试 $CFG ════════════════"
            rm -rf ./build
            xcodebuild archive \
              -project "Orange Cloud.xcodeproj" \
              -scheme "Orange Cloud" \
              -configuration "$CFG" \
              -destination 'generic/platform=iOS' \
              -archivePath ./build/OrangeCloud.xcarchive \
              CODE_SIGN_STYLE="Manual" \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_ENTITLEMENTS="" \
              COMPILER_INDEX_STORE_ENABLE=NO > "xcodebuild-$CFG.log" 2>&1
            RC=$?
            echo "退出码: $RC"
            if [ $RC -eq 0 ]; then
              echo ">>> $CFG 构建成功"
              OK_CFG="$CFG"
              break
            fi
            echo ">>> $CFG 失败，错误摘要（去重）："
            grep -i "error:" "xcodebuild-$CFG.log" | sort -u | head -n 40 || true
            echo ">>> 尾部 30 行："
            tail -n 30 "xcodebuild-$CFG.log" || true
          done
          set -e

          rm -f xcodebuild.log
          for f in xcodebuild-Release.log xcodebuild-Debug.log; do
            [ -f "$f" ] && cat "$f" >> xcodebuild.log
          done

          if [ -z "$OK_CFG" ]; then
            echo "::error::Release 与 Debug 均构建失败"
            exit 1
          fi
          echo "BUILD_CONFIG=$OK_CFG" >> "$GITHUB_ENV"
          echo ">>> 最终使用配置: $OK_CFG"

      - name: Package into IPA
        if: success()
        run: |
          cd "apps/ios/Orange Cloud"
          mkdir -p Payload
          APP_PATH="./build/OrangeCloud.xcarchive/Products/Applications/Orange Cloud.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find ./build -name "*.app" -type d | head -n 1)
          fi
          echo "Using App: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r -9 OrangeCloud-Full-Unlocked.ipa Payload
          echo "IPA packaged successfully:"
          ls -lh OrangeCloud-Full-Unlocked.ipa

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeCloud-Full-Unlocked-IPA
          path: apps/ios/Orange Cloud/OrangeCloud-Full-Unlocked.ipa
          if-no-files-found: error

      - name: Upload Build Log on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-failure-log
          path: apps/ios/Orange Cloud/xcodebuild.log
